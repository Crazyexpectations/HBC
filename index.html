<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a050c" />
    <meta name="description" content="Happy Birthday, Cherry — a little universe made just for you." />
    <title>Happy Birthday, Cherry 💌</title>

    <!-- This page is meant for exactly one person. A Pages site is publicly
         reachable by anyone with the link whether or not the repo is private,
         so at minimum keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />

    <!-- Link preview, for when the link gets pasted into a chat. Deliberately
         no og:image: the only images here are her photos, and a preview card
         would push one of them into every chat app's thumbnail cache. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Happy Birthday, Cherry 💌" />
    <meta property="og:description" content="I told you there was another part. It's here." />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,450;1,9..144,500&family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
